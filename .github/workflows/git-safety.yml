name: Git safety

on:
  pull_request:
  push:
    branches:
      - main
      - ci-cd-development

jobs:
  block-runtime-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "range=${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${{ github.event.before }}...${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Block unsafe files and developer runtime config
        run: bash scripts/check_git_safety.sh --range "${{ steps.diff.outputs.range }}"
